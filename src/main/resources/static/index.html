<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Security Project</title>
</head>
<body>
    <div style="max-width: 320px; margin: 80px auto; font-family: sans-serif;">
        <h2>Login</h2>
        <form method="post" action="/login">
            <div>
                <label>Username</label><br>
                <input type="text" name="username" style="width: 100%; margin: 8px 0;" required>
            </div>
            <div>
                <label>Password</label><br>
                <input type="password" name="password" style="width: 100%; margin: 8px 0;" required>
            </div>
            <button type="submit" style="width: 100%; padding: 8px; cursor: pointer;">Sign In</button>
        </form>
    </div>
</body>
</html>
